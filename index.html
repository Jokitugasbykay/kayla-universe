<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kayla Gabrielle | Physics, AI &amp; Software Engineering</title>
    <meta name="description" content="Authentic portfolio of Kayla Gabrielle: Semester 5 Physics student at Universitas Airlangga, researcher in AI and scientific computing, and founder of JOKI.IN." />
    <meta name="theme-color" content="#04060d" />
    <link rel="icon" type="image/svg+xml" href="./assets/kayla-finance.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #04060d;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        background-color: #04060d;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #04060d;
        color: #94a3b8;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
      }
      .app-preloader-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(148, 163, 184, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="app-preloader-spinner"></div>
        <span>INITIALIZING KAYLA UNIVERSE...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
