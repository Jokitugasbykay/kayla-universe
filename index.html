<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kayla Gabrielle | Physics, AI &amp; Markets</title>
    <meta name="description" content="Kayla Gabrielle, undergraduate Physics student at Universitas Airlangga. Scientific computing, AI modeling, and daily market mechanics." />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="icon" type="image/svg+xml" href="./assets/kayla-logo.svg" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0b0d;
        color: #f4f3ef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        background-color: #0a0b0d;
      }
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0b0d;
        color: #93918a;
        font-family: monospace;
        font-size: 0.875rem;
        letter-spacing: 0.05em;
      }
      .app-preloader-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(200, 173, 141, 0.2);
        border-top-color: #c8ad8d;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="app-preloader-spinner"></div>
        <span>INITIALIZING KAYLA UNIVERSE...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
